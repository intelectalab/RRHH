<title>GestiaHR</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral oscura fija + área de trabajo clara; la ficha del colaborador es el centro del producto. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#F6F8FB;--ink:#15202E;--muted:#5B6678;--line:#E1E6EE;
  --accent:#0A3A73;--accent-ink:#FFFFFF;--accent-soft:#E6F0FB;
  --side:#0A3A73;--side-fg:#DCE7F5;--side-muted:#9DB4D3;--side-active:#11509A;
  --ok:#1E7F4A;--ok-soft:#E3F5EA;--warn:#9A5B0B;--warn-soft:#FFF2D9;--crit:#C0353A;--crit-soft:#FDE9EA;
  --shadow:0 12px 40px rgba(10,37,73,.18);--scrim:rgba(6,25,49,.55);--side-hi:#FFFFFF;--side-accent:#F4B400;--side-ok:#4ADE80;--hd:60px;--sbw:252px;
  --f-display:"IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
/* Tema: claro (azul y blanco) por defecto en cualquier equipo; el oscuro solo se activa si el usuario lo elige en Mi cuenta. */
:root[data-theme="dark"]{
  --bg:#0B1524;--surface:#132137;--surface2:#182A45;--ink:#E6EDF7;--muted:#9AA9C0;--line:#243754;
  --accent:#6FB1F2;--accent-ink:#06203F;--accent-soft:#17335A;
  --side:#071A33;--side-fg:#DCE7F5;--side-muted:#8CA3C4;--side-active:#12305A;
  --ok:#6CC58C;--ok-soft:#173224;--warn:#E3A44B;--warn-soft:#38290F;--crit:#EE8179;--crit-soft:#3B1B19;
  --shadow:0 12px 40px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);--side-accent:#F4B400;color-scheme:dark}
select option,select optgroup{background:var(--surface);color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}h2{font-size:17px;font-weight:700}h3{font-size:14px;font-weight:700}
p{margin:0}a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.i{flex:none;display:block}
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);height:100%}
.app.min{--sbw:68px}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;height:100%;z-index:40;grid-column:1;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:19px;color:var(--side-hi)}
.mark{width:28px;height:28px;border-radius:8px;background:var(--side-accent);display:grid;place-items:center;color:#0A3A73;font-family:var(--f-display);font-weight:700;flex:none}.mark svg{width:100%;height:100%;display:block}
.side .brand{height:var(--hd);padding:0 12px 0 18px;flex:none;border-bottom:1px solid var(--side-active)}
.side .brand b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{width:36px;height:36px;border-radius:9px;border:0;background:none;color:var(--side-muted);display:grid;place-items:center;cursor:pointer;flex:none}.sbtn:hover{background:var(--side-active);color:var(--side-hi)}
.side-user{margin:12px 12px 2px;padding:10px 12px;border-radius:12px;background:var(--side-active);display:flex;gap:10px;align-items:center;min-width:0;flex:none}
.side-user>div{min-width:0;flex:1}.side-user b{display:block;color:var(--side-hi);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user span.r{display:block;font-size:12px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotg{width:8px;height:8px;border-radius:50%;background:var(--side-ok);flex:none}
.side-q{position:relative;margin:10px 12px 0;flex:none;color:var(--side-muted)}.side-q .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.side-q input{width:100%;background:none;border:1px solid var(--side-active);color:var(--side-hi);border-radius:9px;padding:8px 10px 8px 32px;font-size:13px;min-height:38px}.side-q input::placeholder{color:var(--side-muted)}
.side-nav{flex:1;min-height:0;overflow-y:auto;padding:0 12px 10px;scrollbar-width:thin;scrollbar-color:var(--side-active) transparent;display:flex;flex-direction:column;gap:2px}
.side-sec{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px;flex:none}
.side-foot{flex:none;border-top:1px solid var(--side-active);padding:0 12px 10px;display:flex;flex-direction:column;gap:2px}
.navg{display:flex;flex-direction:column;gap:2px;flex:none}
.nav,.navh{display:flex;align-items:center;gap:11px;width:100%;min-height:40px;padding:8px 10px;border-radius:9px;background:none;border:0;color:var(--side-fg);text-align:left;cursor:pointer;font-weight:500;font-size:13.5px;flex:none;transition:background .15s,color .15s;position:relative}
.nav .l,.navh .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav .l small{color:var(--side-muted);font-size:11.5px;margin-left:6px}
.nav:hover,.navh:hover{background:var(--side-active);color:var(--side-hi)}
.nav.on{background:var(--side-active);color:var(--side-hi);font-weight:600}.nav.on .i{color:var(--side-accent)}
.nav.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--side-accent)}
.navh .chev{opacity:.6;transition:transform .2s}.navg.open>.navh .chev{transform:rotate(90deg)}.navg.open>.navh{color:var(--side-hi)}
.sub{display:flex;flex-direction:column;gap:1px;margin:0 0 6px 19px;padding-left:9px;border-left:1px solid var(--side-active)}
.sub .nav{min-height:36px;padding:6px 10px;font-size:13px}.sub .nav.on::before{left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px}
.badge-n{background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;line-height:1.5;flex:none}.badge-n[hidden]{display:none}
.app.min:not(.sopen) .side .l,.app.min:not(.sopen) .side .chev,.app.min:not(.sopen) .side-q,.app.min:not(.sopen) .sub,.app.min:not(.sopen) .side .brand b,.app.min:not(.sopen) .side-user>div,.app.min:not(.sopen) .dotg{display:none}
.app.min:not(.sopen) .side .brand{padding:0;justify-content:center;flex-direction:column;height:auto;gap:4px;padding:12px 0 8px}
.app.min:not(.sopen) .side-user{padding:6px;justify-content:center;background:none;margin:8px 8px 0}
.app.min:not(.sopen) .side-nav,.app.min:not(.sopen) .side-foot{padding-inline:10px}
.app.min:not(.sopen) .nav,.app.min:not(.sopen) .navh{justify-content:center;padding:8px 0}.app.min:not(.sopen) .nav.on::before{left:-10px}
.app.min:not(.sopen) .side-sec{font-size:0;padding:8px 0 4px;border-top:1px solid var(--side-active);margin-top:6px}
.app.min:not(.sopen) .side .badge-n{position:absolute;top:3px;right:3px;padding:0 5px}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:35;border:0;padding:0;cursor:default}
.app.sopen .scrim{display:block}.app.sopen .side{position:fixed;inset:0 auto 0 0;width:min(86vw,292px);transform:none;box-shadow:var(--shadow)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden;grid-column:2}
.top{position:relative;display:flex;align-items:center;gap:8px;height:var(--hd);flex:none;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:nowrap;min-width:0;z-index:30}
.top>*{flex:none}.top>.top-t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.top-t .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.3}
.top-t .ttl{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;letter-spacing:-.01em;margin:0}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);padding:0}.ib:hover{background:var(--surface2);border-color:var(--line)}
.ib .badge-n{position:absolute;top:1px;right:-2px}
summary.ib{list-style:none}
.top>.top-s{flex:0 2 280px;min-width:150px}.top>.chip{flex:0 2 auto;min-width:110px}
.top-s{position:relative;display:flex;align-items:center;color:var(--muted)}
.top-s>.i{position:absolute;left:11px;pointer-events:none}.top-s input{padding-left:34px;padding-right:34px;min-height:40px;border-radius:10px;background:var(--surface2)}
.top-s kbd{position:absolute;right:9px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--surface);color:var(--muted);pointer-events:none}
.top-s .top-sx{display:none}.top-sb{display:none}
.top>.top-s.open{position:absolute;inset:0;width:auto;min-width:0;z-index:6;background:var(--surface);padding:0 12px;gap:6px}
.top-s.open>.i{left:23px}.top-s.open input{flex:1}.top-s.open kbd{display:none}.top-s.open .top-sx{display:inline-grid;flex:none}.top-s.open .menu{left:12px;right:12px;top:calc(100% + 2px)}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:0 4px 0 12px;height:38px;max-width:190px;color:var(--muted);background:var(--surface)}
.chip select{border:0;background:none;padding:6px 2px;min-width:0;width:100%;text-overflow:ellipsis;color:var(--ink);font-weight:600;font-size:13px;border-radius:99px}
.top-cr>summary{display:inline-flex;align-items:center;gap:6px;min-height:40px}
.top-u>summary{display:flex;gap:10px;align-items:center;cursor:pointer;padding:3px 4px 3px 8px;border-radius:12px;min-height:44px;border:1px solid transparent}.top-u>summary:hover{background:var(--surface2);border-color:var(--line)}
.u-n{text-align:right;line-height:1.2;max-width:140px;min-width:0}.u-n b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.u-n small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu.w{width:min(340px,calc(100vw - 24px));max-height:min(70vh,460px);overflow-y:auto}
.menu .mi{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:6px;text-align:left;width:100%}.menu .mi b{font-weight:600;overflow-wrap:anywhere}.menu .mi span{font-size:12px;color:var(--muted)}
.menu .mh{padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.menu .m-emp{padding:6px 10px;display:none;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.menu .m-x{display:none}
.xs-tabs{background:var(--surface);padding:0 20px;flex:none}
.content{flex:1;overflow-y:auto;padding-block:22px 56px;padding-inline:24px;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.crumb{font-size:12px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.head>div:first-child:empty{display:none}.head>div:first-child{min-width:0;flex:1 1 260px}
.hero{background:linear-gradient(120deg,var(--side) 0%,var(--side-active) 100%);color:var(--side-fg);border-radius:14px;padding:20px 22px;align-items:center}
.hero .btn{color:var(--ink)}.alert>.btn{align-self:flex-start}
.hero h2{color:var(--side-hi);font-size:22px}.hero p{margin-top:4px}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.kcard .ki{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kcard b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1}.kcard span{font-size:12px;color:var(--muted);display:block}
.kcard.ok{border-left-color:var(--ok)}.kcard.ok .ki{background:var(--ok-soft);color:var(--ok)}.kcard.warn{border-left-color:var(--warn)}.kcard.warn .ki{background:var(--warn-soft);color:var(--warn)}.kcard.crit{border-left-color:var(--crit)}.kcard.crit .ki{background:var(--crit-soft);color:var(--crit)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.d{color:var(--crit)}.btn.s{padding:4px 9px;font-size:12.5px}.btn.ghost{border-color:transparent;background:none}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:7px;width:100%;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel>.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.pb{padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{padding:14px 16px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi b{font-family:var(--f-display);font-size:28px;display:block;line-height:1.1}.kpi span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
th[data-a]{cursor:pointer}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.av.xl{width:64px;height:64px;font-size:22px;font-family:var(--f-display)}
.who{display:flex;gap:10px;align-items:center;min-width:0}.who div{min-width:0}.who b{display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;position:relative;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{flex:none}
.tab{background:none;border:0;padding:9px 13px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;margin:0}
dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:16px}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tree,.tree ul{list-style:none;margin:0;padding:0}.tree ul{margin-left:17px;padding-left:16px;border-left:1px solid var(--line)}
.tree li{padding-top:8px;position:relative}.tree ul>li::before{content:"";position:absolute;left:-16px;top:26px;width:12px;border-top:1px solid var(--line)}
.node{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px 7px 8px;cursor:pointer;text-align:left;max-width:100%}
.node:hover{border-color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--warn)}.dot.crit{background:var(--crit)}
.empty{padding:36px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.ov{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:start center;padding:6vh 16px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);border:1px solid var(--line)}
.modal header,.modal footer{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header{border-bottom:1px solid var(--line)}.modal footer{border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.form{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;min-width:0}.form .full{grid-column:1/-1}
.err{color:var(--crit);background:var(--crit-soft);padding:8px 12px;border-radius:7px;font-weight:600}
.note{background:var(--accent-soft);padding:9px 12px;border-radius:7px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
.pop{position:relative}.pop>summary{list-style:none}.pop>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:20;display:flex;flex-direction:column;gap:1px}
.menu.l{left:0;right:auto}.menu button,.menu label{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu button:hover,.menu label:hover{background:var(--surface2)}
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-inline:16px}
.login .box{width:min(760px,100%);display:flex;flex-direction:column;gap:18px}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer;text-align:left;flex-wrap:wrap;min-height:44px}
