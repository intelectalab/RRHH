# QA-17 · Ambiente de prueba (staging) y producción en un VPS con Docker.
# Uso (en el servidor, desde la carpeta del repositorio):
#   cp .env.staging.example .env   # y completar los valores
#   scripts/deploy.sh             # construye, migra y levanta todo
# Dos modos (docs/despliegue.md):
#  - Servidor dedicado: COMPOSE_PROFILES=caddy en .env. Caddy toma los puertos 80 y 443 y emite los certificados.
#  - Servidor con Nginx propio (otros sitios): sin perfil. La app, el sitio y la API se publican solo en
#    127.0.0.1 (WEB_PORT, SITE_PORT, API_PORT) y el Nginx del servidor reparte por dominio con sus certificados.
# Postgres y Redis nunca publican puertos: no chocan con un Postgres o Redis que ya tenga el servidor.
name: gestiahr

x-api-env: &api-env
  APP_NAME: GestiaHR
  APP_ENV: ${APP_ENV:-staging}
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Falta APP_KEY}
  APP_URL: https://api.${BASE_DOMAIN}
  LOG_CHANNEL: stderr
  TENANCY_BASE_DOMAIN: ${BASE_DOMAIN}
  TENANCY_APP_URL: https://{slug}.${BASE_DOMAIN}
  TRUSTED_PROXIES: "*"
  IDENTITY_SECURE_COOKIES: "true"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-gestiahr}
  DB_USERNAME: ${DB_USERNAME:-gestiahr}
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  FILESYSTEM_DISK: local
  EMAIL_PROVIDER: smtp
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:?Falta MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Falta MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GestiaHR}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}

x-api: &api
  build:
    context: .
    dockerfile: docker/prod/api.Dockerfile
  image: gestiahr/api:${RELEASE:-latest}
  restart: unless-stopped
  environment: *api-env
  volumes:
    - files:/app/storage/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [interna]

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=1024 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gestiahr}
      POSTGRES_USER: ${DB_USERNAME:-gestiahr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo en una base nueva: el esquema completo del kit (RLS, roles, catálogos). Después, migraciones.
      - ./kit/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gestiahr} -d ${DB_DATABASE:-gestiahr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Falta REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [interna]

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8410}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  horizon:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]

  web:
    build:
      context: .
      dockerfile: docker/prod/node.Dockerfile
      args:
        APP: web
        PORT: 3000
        NEXT_PUBLIC_API_URL: http://api:8000/api
    image: gestiahr/web:${RELEASE:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3410}:3000"
    depends_on: [api]
    networks: [interna]

  site:
    build:
      context: .
      dockerfile: docker/prod/node.Dockerfile
      args:
        APP: site
        PORT: 3001
        SITE_ENV: ${SITE_ENV:-staging}
        SITE_URL: https://${BASE_DOMAIN}
    image: gestiahr/site:${RELEASE:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SITE_PORT:-3411}:3001"
    environment:
      # staging: el sitio responde noindex en todas sus páginas (WEB-1). Solo «production» se indexa.
      SITE_ENV: ${SITE_ENV:-staging}
      SITE_URL: https://${BASE_DOMAIN}
      SITE_API_URL: http://api:8000/api
      SITE_APP_URL: https://{slug}.${BASE_DOMAIN}
    depends_on: [api]
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?Falta BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, web, site]
    networks: [interna]

volumes:
  pgdata:
  redisdata:
  files:
  caddydata:
  caddyconfig:

networks:
  interna:
