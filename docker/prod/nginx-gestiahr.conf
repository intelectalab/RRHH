# QA-17 · GestiaHR detrás del Nginx de un servidor que ya aloja otros sitios.
# Copiar a /etc/nginx/sites-available/gestiahr, reemplazar rrhh.intelectalab.com por el BASE_DOMAIN del .env
# (los puntos del nombre del bloque «~^…$» van escapados) y emitir certificados con certbot (docs/despliegue.md §6b).
# Los contenedores escuchan solo en 127.0.0.1: WEB_PORT 3410 (app y consola), SITE_PORT 3411 (sitio), API_PORT 8410.

map $http_upgrade $gestia_connection_upgrade {
    default upgrade;
    ''      close;
}

# Sitio comercial: https://rrhh.intelectalab.com
server {
    listen 80;
    server_name rrhh.intelectalab.com;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:3411;
        include /etc/nginx/gestiahr-proxy.conf;
    }
}

# API para integraciones y la app móvil: https://api.rrhh.intelectalab.com
server {
    listen 80;
    server_name api.rrhh.intelectalab.com;
    client_max_body_size 30m;
    location /api/internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8410;
        include /etc/nginx/gestiahr-proxy.conf;
    }
}

# Consola (admin.…) y cada organización (<subdominio>.…): la app resuelve la organización por el host.
server {
    listen 80;
    server_name ~^(?<gestia_sub>[a-z0-9-]+)\.rrhh\.intelectalab\.com$;
    client_max_body_size 30m;
    location /api/internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3410;
        include /etc/nginx/gestiahr-proxy.conf;
    }
}
