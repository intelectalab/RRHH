services:
  postgres:
    image: postgres:17.11-alpine
    container_name: aynihr-postgres
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=1024
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aynihr}
      POSTGRES_USER: ${DB_USERNAME:-ayni}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ayni} -d ${DB_DATABASE:-aynihr}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ayni-network

  redis:
    image: redis:7.4.12-alpine
    container_name: aynihr-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ayni-network

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: aynihr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayni-network

  minio-init:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: aynihr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${AWS_BUCKET:-aynihr} &&
        mc anonymous set none local/${AWS_BUCKET:-aynihr} &&
        echo 'Bucket privado inicializado.'
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    restart: "no"
    networks:
      - ayni-network

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: aynihr-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_HTTP_PORT:-8025}:8025"
    networks:
      - ayni-network

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aynihr-api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "Ayni HR"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:J8S6fN2wP0vR4yT7uK1mE9qL3zX5cB8aV4nC2mD1fG0=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-aynihr}
      DB_USERNAME: ${DB_USERNAME:-ayni}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: null
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: aynihr
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    volumes:
      - ./apps/api:/var/www/html
      - ./database:/var/www/database
      - ./tools:/var/www/tools
      - ./api:/var/www/api
      - ./packages:/var/www/packages
      - ./.github:/var/www/.github
      - ./scripts:/var/www/scripts
    ports:
      - "${FORWARD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ayni-network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: aynihr-web
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./apps/web:/app
      - ./packages:/packages
      - ./api:/api
    ports:
      - "${FORWARD_WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - ayni-network

  horizon:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aynihr-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-aynihr}
      DB_USERNAME: ${DB_USERNAME:-ayni}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
      - ./database:/var/www/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ayni-network

networks:
  ayni-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

