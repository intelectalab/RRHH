name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-static-analysis:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, redis, intl, pcntl, opcache, zip
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Pint (PHP code style)
        working-directory: apps/api
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Larastan Level 8)
        working-directory: apps/api
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web (detecta CSS o rutas que solo fallan al compilar)
        working-directory: apps/web
        run: npm run build

      # WEB-1 · Sitio comercial gestiahr.com (aplicación aparte)
      - name: Install Site dependencies
        working-directory: apps/site
        run: npm ci

      - name: Lint, typecheck y build del sitio
        working-directory: apps/site
        run: npm run lint && npm run typecheck && npm run build

  contracts-sync:
    name: OpenAPI Contracts & Types Sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml openapi-spec-validator

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Regenerate OpenAPI specification
        run: python3 kit/tools/gen_openapi.py

      - name: Regenerate TypeScript contracts
        working-directory: apps/web
        run: npx openapi-typescript ../../kit/api/openapi.yaml -o ../../packages/contracts/src/index.ts

      - name: Check for contracts drift
        run: |
          git status --porcelain
          git diff --exit-code kit/api/openapi.yaml packages/contracts/src/index.ts

  tests:
    name: Automated Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aynihr_testing
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayni -d aynihr_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, redis, intl, pcntl, opcache, zip
          # QA-1 · Sin cobertura: el paso normal corre rápido; la cobertura va en coverage.yml (programado o manual).
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Initialize PostgreSQL database schema
        run: |
          # La imagen del runner ya trae psql; solo se instala si falta (evita depender del espejo de apt).
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=secret psql -h 127.0.0.1 -U ayni -d aynihr_testing -f kit/database/schema.sql

      - name: Run Database Isolation Tests
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U ayni -d aynihr_testing -v ON_ERROR_STOP=1 -f kit/database/pruebas_aislamiento.sql

      - name: Verify Database Conventions
        working-directory: apps/api
        env:
          APP_ENV: testing
          APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aynihr_testing
          DB_USERNAME: ayni
          DB_PASSWORD: secret
        run: php artisan db:verify-conventions

      - name: Run Backend Tests
        working-directory: apps/api
        env:
          APP_ENV: testing
          APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aynihr_testing
          DB_USERNAME: ayni
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: Run Site Tests
        working-directory: apps/site
        run: npm ci && npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aynihr_e2e
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayni -d aynihr_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: local
      APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: aynihr_e2e
      DB_USERNAME: ayni
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      TRUSTED_PROXIES: '*'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      E2E_BASE_URL: http://demo.localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, redis, intl, pcntl, opcache, zip
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          (cd apps/api && composer install --prefer-dist --no-interaction --no-progress)
          (cd apps/web && npm ci && npx playwright install --with-deps chromium)

      - name: Clean database with the demo organization
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=secret psql -h 127.0.0.1 -U ayni -d aynihr_e2e -v ON_ERROR_STOP=1 -q -f kit/database/schema.sql
          # La clave del administrador demo se genera en cada corrida: nunca vive en el repositorio.
          echo "E2E_ADMIN_PASSWORD=E2e-$(openssl rand -hex 12)" >> "$GITHUB_ENV"

      - name: Seed demo and start API and web
        run: |
          (cd apps/api && DEMO_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" php artisan db:seed --force)
          (cd apps/api && nohup php artisan serve --host=127.0.0.1 --port=8000 > ../../api-e2e.log 2>&1 &)
          (cd apps/web && npm run build && nohup npx next start -p 3000 > ../../web-e2e.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ingresar >/dev/null && curl -s -o /dev/null http://127.0.0.1:8000/up && break; sleep 2; done

      - name: Run Playwright
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload e2e report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            api-e2e.log
            web-e2e.log
          retention-days: 7
