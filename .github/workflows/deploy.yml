name: CD Deploy & Rollback

# QA-17 · Despliegue manual al VPS por SSH. Corre scripts/deploy.sh en el servidor (git pull, imágenes,
# copia previa, php artisan migrate --force, parámetros legales, servicios y salud) o scripts/rollback.sh.
# Secretos del entorno de GitHub (Settings → Environments → staging / production):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (clave privada) y VPS_PATH (carpeta del repositorio en el servidor).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de destino'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      target_version:
        description: 'Versión o commit para rollback (solo si action=rollback)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Automated Deployment
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.action != 'rollback' }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Check CI of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '[.check_runs[] | select(.name != "Automated Deployment") | .conclusion] | if length == 0 then "none" elif all(. == "success" or . == "skipped") then "success" else "failure" end')
          echo "CI: $state"
          [ "$state" = "success" ] || { echo "::error::El commit no tiene CI en verde; no se despliega."; exit 1; }

      - name: Deploy on server (git pull, build, migrate --force, up)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ] || { echo "::error::Faltan los secretos VPS_HOST / VPS_SSH_KEY del entorno."; exit 1; }
          mkdir -p ~/.ssh && echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "${VPS_USER:-deploy}@$VPS_HOST" "cd '${VPS_PATH:-/opt/gestiahr}' && scripts/deploy.sh ${{ github.sha }}"

  rollback:
    name: Version Rollback
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.action == 'rollback' }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Rollback on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          TARGET: ${{ github.event.inputs.target_version || 'HEAD~1' }}
        run: |
          [ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ] || { echo "::error::Faltan los secretos VPS_HOST / VPS_SSH_KEY del entorno."; exit 1; }
          case "$TARGET" in *[!A-Za-z0-9._~^/-]*) echo "::error::Versión inválida"; exit 1;; esac
          mkdir -p ~/.ssh && echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "${VPS_USER:-deploy}@$VPS_HOST" "cd '${VPS_PATH:-/opt/gestiahr}' && scripts/rollback.sh '$TARGET'"
